{% extends "base.html" %}
{% block title %}Notas{% endblock %}
{% block page_title %}Notas Fiscais{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><div class="card-title">Enviar Nota Fiscal</div></div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Arquivo XML ou PDF</label>
                <input type="file" name="arquivo" accept=".xml,.pdf" required>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</div>
{% endblock %}
