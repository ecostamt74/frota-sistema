{% extends "base.html" %}{% block page_title %}Gestão de Motoristas{% endblock %}{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin: 0;">Motoristas</h2>
    <a href="{{ url_for('novo_motorista') }}" class="btn btn-primary">+ Novo Motorista</a>
</div>
<div class="card">
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>CNH</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for m in motoristas %}
                <tr>
                    <td><strong>{{ m.nome }}</strong></td>
                    <td>{{ m.cpf }}</td>
                    <td>{{ m.cnh or '-' }}</td>
                    <td>
                        <!-- O BOTÃO CORRIGIDO ESTÁ AQUI -->
                        <a href="{{ url_for('editar_motorista', id=m.id) }}" class="btn btn-primary" style="padding: 5px 10px; font-size: 12px;">Editar</a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">Nenhum motorista cadastrado.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
