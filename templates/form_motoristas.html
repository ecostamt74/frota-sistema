{% extends "base.html" %}{% block page_title %}Novo Motorista{% endblock %}{% block content %}
<div class="card" style="max-width: 500px;">
    <div class="card-header">Cadastrar Motorista</div>
    <div class="card-body">
        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; color: #64748b; font-weight: 500;">Nome Completo</label>
                <input type="text" name="nome" required style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; color: #64748b; font-weight: 500;">CPF (somente números)</label>
                <input type="text" name="cpf" required maxlength="11" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-top: 5px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; color: #64748b; font-weight: 500;">CNH (opcional)</label>
                <input type="text" name="cnh" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-top: 5px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Motorista</button>
            <a href="{{ url_for('listar_motoristas') }}" style="display: block; text-align: center; margin-top: 10px; color: #64748b; text-decoration: none;">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
