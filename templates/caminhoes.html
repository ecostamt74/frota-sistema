{% extends "base.html" %}{% block page_title %}Cadastro de Caminhões{% endblock %}{% block content %}
<div class="card">
    <div class="card-header">Caminhões Cadastrados</div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for c in caminhoes %}
                <tr>
                    <td><strong>{{ c.placa }}</strong></td>
                    <td>{{ c.marca }}</td>
                    <td>{{ c.modelo }}</td>
                    <td><span style="background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">Ativo</span></td>
                </tr>
                {% else %}
                <tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">Nenhum caminhão cadastrado.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
